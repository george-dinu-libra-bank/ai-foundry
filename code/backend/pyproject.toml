[project]
name = "rag-teaching-backend"
version = "0.1.0"
description = "RAG concepts, one endpoint at a time — FastAPI + Qdrant teaching backend (Libra Bank Academy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "openai>=1.50",
    "anthropic>=0.40",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-projects>=1.0.0",
    "azure-identity>=1.17",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7",
]

[tool.uv]
# This is an application, not an installable package — sync dependencies only.
package = false
